name: portfolio
description: "Mohamed Ibrahem Portfolio Project is a Flutter-based portfolio application that showcases projects, skills, and personal information. It is designed to be Web Application."


publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.5.0



dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  dio: ^5.7.0
  skeletonizer: ^1.4.2
  flutter_bloc: ^8.1.6
  easy_localization: ^3.0.7
  connectivity_plus: ^6.1.0
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  auto_animated: ^3.2.0
  font_awesome_flutter: ^10.8.0
  url_launcher: ^6.3.1
  avatar_glow: ^3.0.1
  http: ^1.2.2
  html: ^0.15.5
  flutter_inappwebview: ^6.1.5
  youtube_player_iframe: ^5.2.1
  sentry_flutter: ^8.10.1
  visibility_detector: ^0.4.0+2
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.4
  file_saver: ^0.2.14
  flutter_svg: ^2.0.17
  animate_do: ^3.3.4
  get_it: ^8.0.3
  animated_text_kit: ^4.2.2
  cloud_firestore: ^6.0.3
  firebase_core: ^4.2.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  # auto_size_text: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7





flutter:

  uses-material-design: true
  assets:
    # - lib/config/l10n/translation/
    - assets/images/
    - assets/data/
    - assets/files/
    - assets/svgs/
  
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-VariableFont_slnt,wght.ttf
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
